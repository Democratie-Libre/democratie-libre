imports:
    - { resource: security.yml }
    - { resource: services.yml }

parameters:
    locale: fr
    env(DATABASE_HOST): 127.0.0.1
    env(DATABASE_USER): root
    env(DATABASE_PASSWORD): ''
    env(APP_SECRET): ThisTokenIsNotSoSecretChangeIt
    env(TURNSTILE_SITE_KEY): turnstile
    env(TURNSTILE_SECRET): turnstile
    turnstile_enabled: true

framework:
    secret: "%env(APP_SECRET)%"
    default_locale: "%locale%"
    translator:
        default_path: "%kernel.project_dir%/src/App/Resources/translations"
        fallbacks: ["%locale%"]
    router:
        resource: "%kernel.project_dir%/app/config/routing.yml"
        utf8: true
    form: ~
    csrf_protection: ~
    validation:
        email_validation_mode: html5
    session:
        cookie_secure: auto
        cookie_samesite: lax
    fragments: ~
    http_method_override: true
    assets: ~
    php_errors:
        log: true

# Twig Configuration
twig:
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"
    default_path:     "%kernel.project_dir%/app/Resources/views"
    form_themes:
        - 'bootstrap_3_layout.html.twig'

# Doctrine Configuration
doctrine:
    dbal:
        driver:   pdo_mysql
        host:     "%env(DATABASE_HOST)%"
        dbname:   "%env(DATABASE_NAME)%"
        user:     "%env(DATABASE_USER)%"
        password: "%env(DATABASE_PASSWORD)%"
        charset:  utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/App/Entity"
                prefix: 'App\Entity'
                alias: App

doctrine_migrations:
    migrations_paths:
        'Application\Migrations': "%kernel.project_dir%/app/DoctrineMigrations"
    storage:
        table_storage:
            table_name: migration_versions

# Stof\DoctrineExtensionsBundle configuration
stof_doctrine_extensions:
    orm:
        default:
            tree: true
            sluggable: true

