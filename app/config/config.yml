imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }

framework:
    secret: "%secret%"
    default_locale: "%locale%"
    translator:
        default_path: "%kernel.project_dir%/src/App/Resources/translations"
        fallbacks: ["%locale%"]
    router:
        resource: "%kernel.project_dir%/app/config/routing.yml"
        utf8: true
    form: ~
    csrf_protection: ~
    validation:
        email_validation_mode: html5
    session:
        cookie_secure: auto
        cookie_samesite: lax
    fragments: ~
    http_method_override: true
    assets: ~
    php_errors:
        log: true

# Twig Configuration
twig:
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"
    default_path:     "%kernel.project_dir%/app/Resources/views"
    form_themes:
        - 'bootstrap_3_layout.html.twig'

# Doctrine Configuration
doctrine:
    dbal:
        driver:   "%database_driver%"
        host:     "%database_host%"
        port:     "%database_port%"
        dbname:   "%database_name%"
        user:     "%database_user%"
        password: "%database_password%"
        charset:  utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/App/Entity"
                prefix: 'App\Entity'
                alias: App

doctrine_migrations:
    migrations_paths:
        'Application\Migrations': "%kernel.project_dir%/app/DoctrineMigrations"
    storage:
        table_storage:
            table_name: migration_versions

# Stof\DoctrineExtensionsBundle configuration
stof_doctrine_extensions:
    orm:
        default:
            tree: true
            sluggable: true

beelab_recaptcha2:
    site_key: '%google_recaptcha.site_key%'
    secret: '%google_recaptcha.secret%'
