imports:
    - { resource: config_dev.yml }

framework:
    test: true
    session:
        storage_factory_id: session.storage.factory.mock_file
    profiler:
        collect: false

web_profiler:
    toolbar: false
    intercept_redirects: false

doctrine:
    dbal:
        host: "%env(TEST_DATABASE_HOST)%"
        dbname: democratie_libre_test
        user: root
        password: ~

security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
            cost: 4
