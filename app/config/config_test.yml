imports:
    - { resource: config_dev.yml }

framework:
    test: ~
    session:
        storage_id: session.storage.mock_file
    profiler:
        collect: false

web_profiler:
    toolbar: false
    intercept_redirects: false

swiftmailer:
    disable_delivery: true

doctrine:
    dbal:
        host: "%env(TEST_DATABASE_HOST)%"
        dbname: democratie_libre_test
        user: root
        password: ~

security:
    encoders:
        App\Entity\User:
            algorithm: bcrypt
            cost: 4
