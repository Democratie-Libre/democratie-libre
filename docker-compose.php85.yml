# Target environment (PHP 8.5). docker-compose.legacy.yml mirrors the old production (PHP 7.2).
name: democratie-libre-php85

services:
  php:
    build: docker/php85
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      SYMFONY_DEPRECATIONS_HELPER: disabled
      TEST_DATABASE_HOST: db

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: democratie_libre_test
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
