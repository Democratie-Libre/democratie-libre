name: democratie-libre

services:
  php:
    build: docker/php
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYMFONY_DEPRECATIONS_HELPER: disabled
      TEST_DATABASE_HOST: db

  php-fpm:
    build: docker/php-fpm
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build: docker/nginx
    volumes:
      - .:/app:ro
    ports:
      - '80:80'
    depends_on:
      - php-fpm

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mariadb_data:/var/lib/mysql

  adminer:
    image: adminer
    ports:
      - '9000:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
