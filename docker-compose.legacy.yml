# Environment mirroring production (PHP 7.2) to run the test suite before the migration.
name: democratie-libre-legacy

services:
  php:
    build: docker/php72
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      SYMFONY_DEPRECATIONS_HELPER: disabled
      TEST_DATABASE_HOST: db

  db:
    image: mariadb:10.3
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: democratie_libre_test
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
